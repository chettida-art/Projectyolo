<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLO Polygon Predict</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
    --accent: #3b5bdb; --accent-soft: #e7ecff; --border: #e1e5ee; --error: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b5;
      --accent: #748ffc; --accent-soft: #232a40; --border: #2c3341; --error: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Sarabun", system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .classes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .chip { background: var(--accent-soft); color: var(--accent); padding: 3px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 26px 12px; text-align: center; cursor: pointer; color: var(--muted); transition: .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); color: var(--accent); }
  .drop img { max-width: 100%; max-height: 200px; border-radius: 8px; display: block; margin: 0 auto 8px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .result img { width: 100%; border-radius: 10px; display: block; }
  .placeholder { color: var(--muted); text-align: center; padding: 80px 0; }
  .top { font-size: 1.25rem; margin: 14px 0 10px; }
  .top b { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .bar { height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .error { color: var(--error); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ทายรูปด้วย YOLO Polygon (Segmentation)</h1>
  <p class="sub">อัปโหลดรูป แล้วโมเดลที่เทรนด้วย Polygon weight จะวาดขอบเขตวัตถุและบอกว่าเป็นอะไร</p>

  <div class="classes">
    {% for n in names %}<span class="chip">{{ n }}</span>{% endfor %}
  </div>

  <div class="grid">
    <div class="card">
      <div class="drop" id="drop">
        <div id="preview">คลิก, ลากรูปมาวาง หรือกด <b>Ctrl+V</b> เพื่อวางรูปที่ copy มา</div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>

      <label for="conf">Confidence ขั้นต่ำ: <span id="confVal">0.25</span></label>
      <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.25">

      <button id="btn" disabled>Predict</button>
      <div class="error" id="err"></div>
    </div>

    <div class="card result" id="result">
      <div class="placeholder">ผลลัพธ์จะแสดงที่นี่</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), btn = $("btn");
let currentFile = null;

$("conf").oninput = e => $("confVal").textContent = e.target.value;
drop.onclick = () => fileInput.click();
fileInput.onchange = () => setFile(fileInput.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); };

// วางรูปที่ copy มา (Ctrl+V) ได้ทั้งหน้า แล้วทายให้ทันที
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (!item) {
    $("err").textContent = "คลิปบอร์ดไม่มีรูปภาพ (ลองคลิกขวาที่รูปแล้วเลือก Copy image)";
    return;
  }
  e.preventDefault();
  const blob = item.getAsFile();
  const ext = blob.type.split("/")[1] || "png";
  if (setFile(new File([blob], `pasted.${ext}`, { type: blob.type }))) predict();
});

function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return false;
  currentFile = f;
  $("preview").innerHTML = `<img src="${URL.createObjectURL(f)}"><span>${f.name}</span>`;
  btn.disabled = false;
  $("err").textContent = "";
  return true;
}

btn.onclick = () => predict();

async function predict() {
  if (!currentFile) return;
  btn.disabled = true; btn.textContent = "กำลังทาย...";
  $("err").textContent = "";
  const fd = new FormData();
  fd.append("image", currentFile);
  fd.append("conf", $("conf").value);
  try {
    const res = await fetch("/predict", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "เกิดข้อผิดพลาด");
    render(data);
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Predict";
  }
}

function render(data) {
  const d = data.detections;
  let html = `<img src="${data.image}" alt="ผลลัพธ์">`;
  if (!d.length) {
    html += `<p class="top">ไม่พบวัตถุที่รู้จัก (ลองลด Confidence ลง)</p>`;
  } else {
    html += `<p class="top">โมเดลทายว่าเป็น: <b>${d[0].label}</b> (${(d[0].confidence * 100).toFixed(1)}%) — พบทั้งหมด ${d.length} วัตถุ</p>`;
    html += `<table><tr><th>#</th><th>Class</th><th>Confidence</th><th>จุด Polygon</th></tr>`;
    d.forEach((x, i) => {
      const p = (x.confidence * 100).toFixed(1);
      html += `<tr><td>${i + 1}</td><td>${x.label}</td>
        <td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><span style="width:${p}%"></span></div>${p}%</div></td>
        <td>${x.polygon_points}</td></tr>`;
    });
    html += `</table>`;
  }
  $("result").innerHTML = html;
}
</script>
</body>
</html>
